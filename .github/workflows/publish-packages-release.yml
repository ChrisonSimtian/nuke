# Hand-written (not auto-generated) — see Build.CI.GitHubActions.cs for the
# rationale (lets us bridge GitHub's NUGET_API_KEY secret to Fallout's
# NuGetApiKey parameter, which would otherwise have to share a name).
#
# This is the DELIBERATE (production) release path. The fast test lane —
# develop (-preview), push → GitHub Packages — lives in publish-packages-preview.yml.
# See ADR-0009 (superseding ADR-0004, and carrying forward ADR-0008's no-`experimental`
# decision onto `develop`).
#
# Shape:
#   - Trigger: tag push `v*` on a production branch — the classic GitFlow
#     production trunk (main → tag v10.5.0), release stabilization lines
#     (release/v10.5 → tag v10.5.0-rc.N), or gitflow support lines (support/v10 →
#     v10.x, and eventually a retired support/v11 once a later major replaces it).
#     develop is NEVER tagged for release. Tags keep the `v` prefix so the `v*`
#     tag-protection ruleset applies; the package version core is the bare semver
#     (e.g. 10.5.0). Tag protection restricts who can create those tags to repo
#     admins.
#   - Optional fallback: workflow_dispatch with an existing-tag input, for
#     re-runs after a transient publish-API failure, OR to opt into a
#     nuget.org publish (see below).
#   - validate-ref → test-and-pack → fan out to three publish jobs in parallel:
#       - publish-nuget-org   (opt-in via workflow_dispatch flag, approval-gated)
#       - publish-github-packages (all packages — Fallout.* + Nuke.*)
#       - publish-github-releases (artifact bundling on the tag's GH Release)
#
# Channel routing (ADR-0009):
#   - nuget.org is OPT-IN. Tag pushes do NOT auto-publish there. To publish
#     Fallout.* to nuget.org you invoke workflow_dispatch with
#     publish-to-nugetorg=true — a conscious "this release is stabilised enough"
#     switch, used when a `main` GA release is ready for the broad consumer
#     audience, or for a support/v10 legacy security patch.
#   - GitHub Packages gets every Fallout.* and Nuke.* build via tag push.
#   - GitHub Releases bundles nupkgs on the tag's release page regardless.
#
# See docs/branching-and-release.md for the full runbook.

# The workflow `name:` below is load-bearing: Build.cs gates
# ICreateGitHubRelease.CreateGitHubRelease on `github.workflow ==
# ReleaseWorkflow` (the const in build/Build.CI.GitHubActions.cs). Keep the two
# in sync — rename here and you must rename the const, or GitHub Releases stop
# being cut.
name: publish-packages-release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback for two scenarios:
  #   1. Re-running a partial publish after a transient API failure (pick the
  #      tag, leave publish-to-nugetorg at its default).
  #   2. Opting into a nuget.org publish for a stabilised release (pick the
  #      tag, set publish-to-nugetorg to true). Still gated by the nuget-org
  #      env approval before the actual push.
  # `--skip-duplicate` on each push makes re-runs idempotent.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release (e.g. v10.5.5)'
        required: true
      publish-to-nugetorg:
        description: 'Publish Fallout.* to nuget.org? Default false — opt-in for stabilised releases only.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-ref:
    name: validate ref
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Verify tag is reachable from a production branch'
        run: |
          set -euo pipefail
          TAG_SHA="${{ github.sha }}"
          # Match the GitFlow production trunk (main, GA tags), release
          # stabilization lines (release/v10.5, …, rc tags), and gitflow
          # support lines (support/v10 legacy semver, and eventually a retired
          # support/v11, …).
          REACHABLE=$(git branch -r --contains "$TAG_SHA" | grep -E 'origin/(main|release/v[0-9]+(\.[0-9]+)?|support/v[0-9]+)$' || true)
          if [ -z "$REACHABLE" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} at $TAG_SHA is not reachable from any production branch."
            echo "Tag-triggered releases only fire from main (GA), release/vX.Y (rc), or support/* (legacy/retired) branches."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} validated. Reachable from:"
          echo "$REACHABLE"

  test-and-pack:
    name: test + pack
    runs-on: ubuntu-latest
    needs: [validate-ref]
    # Run when validate-ref succeeded (tag push) OR was skipped (workflow_dispatch).
    if: always() && (needs.validate-ref.result == 'success' || needs.validate-ref.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0           # Nerdbank.GitVersioning needs full history
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-release-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props', 'version.json') }}
          restore-keys: |
            ${{ runner.os }}-release-
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: Test + Pack + PackageGuard'
        run: dotnet fallout Test Pack PackageGuard
        env:
          # We check out the tag above, so HEAD is detached and matches none of
          # version.json's publicReleaseRefSpec entries (they're all branch refs,
          # and nbgv never matches that spec against refs/tags/*). Without this,
          # NB.GV treats the build as non-public and stamps a git-height suffix
          # onto every package — v10.4.0-rc.3 shipped as 10.4.0-rc.3.geabd043cc2.
          PublicRelease: true
          # PackageGuard's own target (build/Build.PackageGuard.cs) is gated on either being on
          # a long-lived branch or running in this workflow (GitHubActions.Workflow ==
          # "publish-packages-release") — the tag checkout above leaves HEAD detached, so the
          # branch check alone can't pass here; validate-ref already proved the tag is
          # reachable from a production branch. GITHUB_TOKEN lets it authenticate to GitHub
          # (license lookups) instead of hitting anonymous rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Upload: package artifacts'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: output/packages/*.nupkg
          retention-days: 7
          if-no-files-found: error
      - name: 'Upload: PackageGuard SBOM + risk report'
        uses: actions/upload-artifact@v7
        with:
          name: packageguard
          path: output/packageguard/*
          retention-days: 7
          if-no-files-found: error

  # Tier 1 — production / nuget.org. **OPT-IN ONLY.** Tag pushes do NOT trigger
  # this job; you must invoke workflow_dispatch with publish-to-nugetorg=true.
  # The env approval gate on `nuget-org` is the second layer — even after opting
  # in via the input flag, you still approve the deployment.
  #
  # The opt-in defaults to false because the default channel is GitHub Packages
  # (see header comment). When a `main` GA release is ready for the broad
  # audience — or for cutting a support/v10 maintenance patch — invoke
  # workflow_dispatch with the flag set.
  #
  # The condition below accepts the string 'true' as well as the boolean. A
  # `type: boolean` input only arrives as a real boolean when the run is started
  # from the Actions UI; the REST API — and therefore `gh workflow run`, which
  # rejects a JSON boolean outright — can only send strings. Comparing a string
  # to a boolean casts both to numbers ('true' → NaN, true → 1), so a bare
  # `== true` silently skipped every CLI-triggered publish while the run still
  # reported success. See the runbook's `gh workflow run` invocation.
  publish-nuget-org:
    name: publish → nuget.org
    runs-on: ubuntu-latest
    needs: [test-and-pack]
    # `always() && needs...result == 'success'` rather than a bare dependency:
    # validate-ref is skipped by design on workflow_dispatch, and a skipped job
    # propagates through the graph — test-and-pack's own always() rescues only
    # itself, not its dependents. Without this the whole dispatch path silently
    # published nothing while the run still reported success.
    if: >-
      always() && needs.test-and-pack.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && (inputs.publish-to-nugetorg == true || inputs.publish-to-nugetorg == 'true')
    environment:
      name: nuget-org
      url: https://www.nuget.org/profiles/Fallout.build
    steps:
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: 'Download: package artifacts'
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: output/packages
      - name: 'Push: Fallout.* to nuget.org'
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(output/packages/Fallout.*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No Fallout.* packages found in artifact — nothing to publish."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            echo "Pushing $pkg to nuget.org..."
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --skip-duplicate
          done

  # Tier 2 — GitHub Packages. The default release channel. Pushes both
  # Fallout.* AND Nuke.* transition shims. The Nuke.* shim IDs are owned by the
  # original NUKE maintainer on nuget.org (#47) — GitHub Packages is their
  # permanent home. Fallout.* is here because nuget.org is opt-in by default
  # (see header).
  publish-github-packages:
    name: publish → GitHub Packages
    runs-on: ubuntu-latest
    needs: [test-and-pack]
    # See publish-nuget-org: survives validate-ref's by-design skip on
    # workflow_dispatch, which is what makes a re-run after a partial publish
    # actually re-publish.
    if: always() && needs.test-and-pack.result == 'success'
    permissions:
      packages: write
    environment:
      name: github-packages
      url: https://github.com/Fallout-build/Fallout/packages
    steps:
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: 'Download: package artifacts'
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: output/packages
      - name: 'Push: all *.nupkg to GitHub Packages'
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(output/packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No packages found in artifact — nothing to publish."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            echo "Pushing $pkg to GitHub Packages..."
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/Fallout-build/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done

  # Bundled artifact distribution. Attaches all nupkgs, plus the PackageGuard SBOM and HTML
  # risk report, to the GitHub Release for the tag. Idempotent: if the release already exists
  # (workflow_dispatch retry case), uploads or replaces missing assets via --clobber. The .sarif
  # itself isn't attached here — it's reported to GitHub's code-scanning feature instead
  # (security-scan.yml); the HTML is the human-readable counterpart of the same report.
  publish-github-releases:
    name: publish → GitHub Releases
    runs-on: ubuntu-latest
    needs: [test-and-pack]
    # See publish-nuget-org.
    if: always() && needs.test-and-pack.result == 'success'
    permissions:
      contents: write
    environment:
      name: github-releases
      url: https://github.com/Fallout-build/Fallout/releases
    steps:
      - uses: actions/checkout@v7
      - name: 'Download: package artifacts'
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: output/packages
      - name: 'Download: PackageGuard SBOM + risk report'
        uses: actions/download-artifact@v8
        with:
          name: packageguard
          path: output/packageguard
      - name: 'Create or update GitHub Release with package artifacts'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "Tag: $TAG"
          assets=(output/packages/*.nupkg)
          if [ -f output/packageguard/sbom.json ]; then
            assets+=("output/packageguard/sbom.json")
          fi
          if [ -f output/packageguard/risk-report.html ]; then
            assets+=("output/packageguard/risk-report.html")
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets with --clobber."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            echo "Creating new release $TAG."
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --generate-notes \
              "${assets[@]}"
          fi
