# Hand-written. The "preview" channel — `develop` (ADR-0009, superseding ADR-0004).
#
# Shape:
#   - Trigger: push to `develop`. `develop` is the integration trunk / `-preview`
#     channel — the deliberate lane where work stabilises. Nerdbank.GitVersioning
#     produces a prerelease of the form `10.5.0-preview.<height>.g<commit>`
#     (`develop` is intentionally NOT a public-release ref in version.json), so these
#     never look like a stable release.
#   - Builds + packs, then pushes every *.nupkg to GitHub Packages ONLY.
#   - Deliberately does NOT touch nuget.org and does NOT create a GitHub Release.
#     GitHub Packages is the test/preview channel and is opt-in for consumers
#     (they add the feed), so it causes none of the nuget.org Dependabot
#     fan-out that ADR-0001 / ADR-0002 were avoiding.
#
# `develop` is the only continuous prerelease lane. ADR-0008 folded the former
# `experimental` `-alpha` lane into the trunk; ADR-0009 keeps that, just renamed
# onto `develop`. Stable and legacy releases are deliberate and tag-triggered —
# see publish-packages-release.yml. Cross-platform validation (macOS/Windows)
# only runs on release intent (build-cross-platform.yml), not on `develop`
# pushes — `develop` relies on the ubuntu-latest gate (build.yml) instead.
# This workflow's job is publishing, not gating.

name: publish-packages-preview

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '.assets/**'
      - '**/*.md'

# Cancel a superseded preview build when a newer commit lands (#322). Never on publish-packages-release.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: preview → GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
    environment:
      name: github-packages
      url: https://github.com/Fallout-build/Fallout/packages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # Nerdbank.GitVersioning needs full history
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-preview-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props', 'version.json') }}
          restore-keys: |
            ${{ runner.os }}-preview-
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      # Test + Pack + push preview → GitHub Packages, all through our own framework (#333) —
      # dogfooding `dotnet fallout Publish` instead of a hand-rolled `dotnet nuget push`.
      # `Publish` depends on Test + Pack, so NUKE runs Restore → Compile → Test → Pack →
      # Publish as discrete internal stages and fails at the breaking stage; if Test fails
      # the job stops before any push. Which packages go where (Fallout.* + Nuke.* → GitHub
      # Packages) is decided by Build.cs IPublish.PublishTargets, not here.
      - name: 'Publish: preview → GitHub Packages'
        run: dotnet fallout Publish --publish-to github-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
